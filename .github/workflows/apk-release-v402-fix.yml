name: BORSA TAKIP V4.0.3 RELEASE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate current broad BIST universe
        run: python3 tools/generate_bist_universe.py
      - name: Apply watchlist update
        run: python3 tools/apply_watchlist.py
      - name: Apply stock search update
        run: python3 tools/apply_stock_search.py
      - name: Apply V4 performance update
        run: python3 tools/apply_v4.py
      - name: Apply fast data flow update
        run: python3 tools/apply_fast_data.py
      - name: Normalize V4 imports
        run: python3 tools/fix_v4_imports.py
      - name: Add API quick access
        run: python3 tools/apply_api_quick_access.py
      - name: Fix API quick access syntax
        run: python3 tools/fix_api_quick_access.py
      - name: Fix API quick access on V4 launcher source
        run: python3 tools/fix_api_quick_access_v4.py
      - name: Complete V4 cleanup and release identity
        run: python3 tools/apply_v402_completion.py
      - name: Apply V4.0.3 production fixes
        run: python3 tools/apply_v403_fixes.py
      - name: Verify V4.0.3 corrections
        run: |
          grep -q 'versionName = "4.0.3"' app/build.gradle.kts
          grep -q 'versionCode = 43' app/build.gradle.kts
          grep -q 'android:label="Borsa Takip V4"' app/src/main/AndroidManifest.xml
          test -f app/src/main/java/tr/borsatakip/v3/MainActivityV4.kt
          test ! -f app/src/main/java/tr/borsatakip/v3/MainActivityV2.kt
          grep -q 'Market.VIOP' app/src/main/java/tr/borsatakip/v3/MainActivityV4.kt
          grep -q 'Market.BIST' app/src/main/java/tr/borsatakip/v3/MainActivityV4.kt
          grep -q 'rsiWilder' app/src/main/java/tr/borsatakip/v3/analysis/TechnicalAnalyzer.kt
          grep -q 'vwap' app/src/main/java/tr/borsatakip/v3/analysis/TechnicalAnalyzer.kt
          grep -q 'marketType' app/src/main/java/tr/borsatakip/v3/model/Stock.kt
          ! grep -q 'X-API-Secret' app/src/main/java/tr/borsatakip/v3/market/LiveBackendMarketDataProvider.kt
          grep -q 'GECİKMELİ VERİ' app/src/main/java/tr/borsatakip/v3/market/YahooBistMarketDataProvider.kt
      - name: Build signed release APK
        run: gradle assembleRelease --stacktrace
      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/apk/release/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BORSA-TAKIP-V4.0.3-FULL-BIST-VIOP
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
