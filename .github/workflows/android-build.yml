name: Borsa Takip 5.1.28 APK

on:
  push:
    branches: [ v5.1.28-screen-update ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize transferred XML resources
        shell: python
        run: |
          import json
          from pathlib import Path
          for p in Path('app/src/main/res/layout').glob('*.xml'):
              raw = p.read_text(encoding='utf-8-sig')
              s = raw.lstrip()
              if s.startswith('{'):
                  try:
                      obj = json.loads(raw)
                      content = obj.get('content')
                      if isinstance(content, str) and content.lstrip().startswith('<?xml'):
                          p.write_text(content, encoding='utf-8')
                          print(f'Unwrapped {p}')
                  except Exception as e:
                      print(f'Could not unwrap {p}: {e}')
      - name: Validate XML resources
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for p in Path('app/src/main/res/layout').glob('*.xml'):
              ET.parse(p)
          print('All layout XML files are valid.')
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify version
        run: |
          grep -q 'versionCode = 78' app/build.gradle.kts
          grep -q 'versionName = "5.1.28"' app/build.gradle.kts
      - name: Build installable release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: BORSA-TAKIP-V5.1.28-INSTALLABLE
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
