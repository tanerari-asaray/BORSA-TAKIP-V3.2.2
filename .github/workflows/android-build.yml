name: Borsa Takip 5.1.28 APK

on:
  push:
    branches: [ v5.1.28-screen-update ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify version
        run: |
          grep -q 'versionCode = 78' app/build.gradle.kts
          grep -q 'versionName = "5.1.28"' app/build.gradle.kts

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Sign installable APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          ZIPALIGN="$(find "$SDK_ROOT/build-tools" -type f -name zipalign | sort -V | tail -1)"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -f "$APK"
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/borsatakip-release.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/borsatakip-release.keystore" \
              -storepass android \
              -alias borsatakip \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Borsa Takip, OU=Mobile, O=Borsa Takip, C=TR"
          fi
          "$ZIPALIGN" -f 4 "$APK" "${APK%.apk}-aligned.apk"
          "$APKSIGNER" sign \
            --ks "$HOME/.android/borsatakip-release.keystore" \
            --ks-pass pass:android \
            --ks-key-alias borsatakip \
            --key-pass pass:android \
            --out "${APK%.apk}-signed.apk" "${APK%.apk}-aligned.apk"
          mv "${APK%.apk}-signed.apk" "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: BORSA-TAKIP-V5.1.28-INSTALLABLE
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
