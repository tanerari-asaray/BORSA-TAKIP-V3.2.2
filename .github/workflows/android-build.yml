name: Android APK Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply watchlist update
        run: python3 tools/apply_watchlist.py
      - name: Apply stock search update
        run: python3 tools/apply_stock_search.py
      - name: Persist app updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add app/src/main/java/tr/borsatakip/v3/MainActivity.kt app/src/main/res/layout/activity_main.xml
            git commit -m "Improve BIST stock search [skip ci]"
            git push
          fi
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BORSA-TAKIP-V3.2.5-BIST-ARAMA
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
