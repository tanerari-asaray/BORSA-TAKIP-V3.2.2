name: BorsaTakip V5.1.28 APK Build

on:
  push:
    branches:
      - v5.1.28-screen-update
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore corrected V5.1.28 source
        shell: bash
        run: |
          test -f payload/BorsaTakipV5.1.28-F01-F28-UYGULANMIS.zip.b64
          base64 -d payload/BorsaTakipV5.1.28-F01-F28-UYGULANMIS.zip.b64 > /tmp/borsa.zip
          rm -rf /tmp/borsa-src
          mkdir -p /tmp/borsa-src
          unzip -q /tmp/borsa.zip -d /tmp/borsa-src
          test -f /tmp/borsa-src/bt/app/build.gradle.kts
          rsync -a --delete /tmp/borsa-src/bt/ ./
          rm -rf payload

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BorsaTakipV5.1.28-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
