name: APK V4.0.6 FULL REFERENCE UI RELEASE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate current full BIST universe
        run: python3 tools/generate_bist_universe.py
      - name: Apply V4 release identity and cleanup
        run: python3 tools/apply_v402_completion.py
      - name: Apply V4.0.3 production fixes
        run: python3 tools/apply_v403_fixes.py
      - name: Apply 8-screen reference palette and resources
        run: python3 tools/apply_v404_reference_ui.py
      - name: Apply FULL 8-screen reference implementation
        run: python3 tools/apply_v406_full_reference_ui.py
      - name: Apply V4.0.6 compile cleanup
        run: python3 tools/fix_v406_compile.py
      - name: Build release APK
        run: gradle clean assembleRelease --stacktrace
      - name: Align and sign APK with Android APK Signature Scheme
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          ZIPALIGN="$(find "$SDK_ROOT/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          "$ZIPALIGN" -f 4 "$APK" "${APK%.apk}-aligned.apk"
          mv "${APK%.apk}-aligned.apk" "$APK"
          "$APKSIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --out "${APK%.apk}-signed.apk" "$APK"
          mv "${APK%.apk}-signed.apk" "$APK"
      - name: Verify APK signature and package
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          jarsigner -verify "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BORSA-TAKIP-V4.0.6-FULL-REFERENCE-UI
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
