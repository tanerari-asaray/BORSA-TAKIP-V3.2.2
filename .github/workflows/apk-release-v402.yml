name: APK V4.0.4 REFERENCE UI RELEASE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate current full BIST universe
        run: python3 tools/generate_bist_universe.py
      - name: Apply V4 release identity and cleanup
        run: python3 tools/apply_v402_completion.py
      - name: Apply V4.0.3 production fixes
        run: python3 tools/apply_v403_fixes.py
      - name: Apply 8-screen reference UI
        run: python3 tools/apply_v404_reference_ui.py
      - name: Validate and report reference UI
        run: |
          echo "=== V4.0.4 ==="
          grep 'versionName' app/build.gradle.kts || true
          grep 'versionCode' app/build.gradle.kts || true
          echo "=== UI markers ==="
          grep -o 'bg_bist\|bg_viop\|bg_opportunity\|demoSwitch\|notificationSwitch\|autoScanSwitch' app/src/main/res/layout/activity_main.xml | sort | uniq -c || true
          echo "=== Technical markers ==="
          grep -q 'rsiWilder' app/src/main/java/tr/borsatakip/v3/analysis/TechnicalAnalyzer.kt && echo 'Wilder RSI: OK'
          grep -q 'vwap' app/src/main/java/tr/borsatakip/v3/analysis/TechnicalAnalyzer.kt && echo 'VWAP: OK'
          grep -q 'marketType' app/src/main/java/tr/borsatakip/v3/model/Stock.kt && echo 'Market identity: OK'
          ! grep -q 'X-API-Secret' app/src/main/java/tr/borsatakip/v3/market/LiveBackendMarketDataProvider.kt && echo 'Client API secret header: removed'
          grep -q 'GECİKMELİ VERİ' app/src/main/java/tr/borsatakip/v3/market/YahooBistMarketDataProvider.kt && echo 'Yahoo freshness label: OK'
      - name: Build signed release APK
        run: gradle clean assembleRelease --stacktrace
      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/apk/release/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BORSA-TAKIP-V4.0.4-REFERENCE-UI
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
