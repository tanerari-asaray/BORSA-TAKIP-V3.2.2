name: APK Direct Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply watchlist update
        run: python3 tools/apply_watchlist.py
      - name: Apply stock search update
        run: python3 tools/apply_stock_search.py
      - name: Apply V4 performance update
        run: python3 tools/apply_v4.py
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BORSA-TAKIP-V4.0.1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
