name: APK V4.0.3 DEBUG FULL BIST VIOP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate current full BIST universe
        run: python3 tools/generate_bist_universe.py
      - name: Fix generated launcher identity
        run: python3 tools/apply_v402_completion.py
      - name: Verify BIST + VIOP
        run: |
          grep -q 'versionName = "4.0.3"' app/build.gradle.kts
          grep -q 'Market.VIOP' app/src/main/java/tr/borsatakip/v3/MainActivityV4.kt
          grep -q 'Market.BIST' app/src/main/java/tr/borsatakip/v3/MainActivityV4.kt
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BORSA-TAKIP-V4.0.3-FULL-BIST-VIOP-DEBUG
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
